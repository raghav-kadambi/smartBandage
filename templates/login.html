<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Log in · WoundSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand"><span class="dot"></span><span>WoundSense</span></div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to view your bandage readings.</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <div class="auth-switch">Don't have an account? <a href="{{ url_for('signup_page') }}">Sign up</a></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || 'Something went wrong.';
        errorMsg.style.display = 'block';
        return;
      }
      window.location.href = data.redirect;
    });
  </script>
</body>
</html>
