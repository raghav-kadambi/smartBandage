<!doctype html>
<html lang="en">
{% from "_sidebar.html" import sidebar %}
<head>
  <meta charset="utf-8" />
  <title>Choose input · WoundSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="shell">
    {{ sidebar('dashboard', user_name) }}

    <main class="main">
      <div class="page-header">
        <h1>How should the bandage readings come in?</h1>
        <span class="meta">You can switch at any time from the dashboard</span>
      </div>

      <div class="mode-grid">
        <button class="mode-card {{ 'selected' if current_mode == 'simulate' else '' }}" data-mode="simulate">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          <div class="mode-title">Simulate with sliders</div>
          <div class="mode-desc">Drag sliders for temperature, humidity, heart rate and blood pressure to try any scenario. Each change runs the trained models instantly.</div>
          <span class="mode-cta">Use sliders →</span>
        </button>

        <button class="mode-card {{ 'selected' if current_mode == 'esp32' else '' }}" data-mode="esp32">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
          <div class="mode-title">Connect ESP32 bandage</div>
          <div class="mode-desc">Stream live readings from the ESP32 over Wi-Fi. You'll get a device token and server address to paste into the firmware.</div>
          <span class="mode-cta">Connect device →</span>
        </button>
      </div>
      <div class="error-msg" id="modeError" style="display:none;"></div>
    </main>
  </div>

  <script>
    document.querySelectorAll(".mode-card").forEach((card) => {
      card.addEventListener("click", async () => {
        const res = await fetch("/api/mode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: card.dataset.mode }),
        });
        const data = await res.json();
        if (!res.ok) {
          const err = document.getElementById("modeError");
          err.textContent = data.error || "Could not set mode.";
          err.style.display = "block";
          return;
        }
        window.location.href = data.redirect;
      });
    });
  </script>
</body>
</html>
